# ══════════════════════════════════════════════════════
# PLAFONNIER
# ══════════════════════════════════════════════════════
plafonnier_blanc:
  alias: "Plafonnier Blanc"
  sequence:
    - service: light.turn_on
      target:
        entity_id: light.plafonier_mathyou
      data:
        hs_color: [54.5, 21.6]
        brightness: 255

plafonnier_orange:
  alias: "Plafonnier Orange"
  sequence:
    - service: light.turn_on
      target:
        entity_id: light.plafonier_mathyou
      data:
        hs_color: [28.2, 100.0]
        brightness: 255

plafonnier_rouge:
  alias: "Plafonnier Rouge"
  sequence:
    - service: light.turn_on
      target:
        entity_id: light.plafonier_mathyou
      data:
        hs_color: [0.0, 100.0]
        brightness: 255

plafonnier_vert:
  alias: "Plafonnier Vert"
  sequence:
    - service: light.turn_on
      target:
        entity_id: light.plafonier_mathyou
      data:
        hs_color: [120.0, 100.0]
        brightness: 255

plafonnier_bleu:
  alias: "Plafonnier Bleu"
  sequence:
    - service: light.turn_on
      target:
        entity_id: light.plafonier_mathyou
      data:
        hs_color: [240.0, 100.0]
        brightness: 255

plafonnier_violet:
  alias: "Plafonnier Violet"
  sequence:
    - service: light.turn_on
      target:
        entity_id: light.plafonier_mathyou
      data:
        hs_color: [282.4, 100.0]
        brightness: 255

